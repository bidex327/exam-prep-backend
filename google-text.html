
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamPrep NG - Google Sign-In Test</title>
</head>
<body>
  <h1>ExamPrep NG</h1>
  <h2>Test Google Sign-In</h2>

  <p>Click the button below to sign in with Google.</p>

  <div id="google-button"></div>

  <pre id="result">Waiting for Google Sign-In...</pre>

  <script src="https://accounts.google.com/gsi/client" async></script>

  <script>
    const GOOGLE_CLIENT_ID = "630969447983-m3fiipb43psb3mpqg38fc1v7hjsdk384.apps.googleusercontent.com";

    window.addEventListener("load", () => {
      const checkGoogle = setInterval(() => {
        if (window.google?.accounts?.id) {
          clearInterval(checkGoogle);

          google.accounts.id.initialize({
            client_id: GOOGLE_CLIENT_ID,
            callback: handleGoogleResponse
          });

          google.accounts.id.renderButton(
            document.getElementById("google-button"),
            {
              theme: "outline",
              size: "large",
              text: "signin_with"
            }
          );
        }
      }, 200);

      setTimeout(() => clearInterval(checkGoogle), 10000);
    });

    async function handleGoogleResponse(response) {
      const result = document.getElementById("result");
      result.textContent = "Sending Google ID token to backend...";

      try {
        const apiResponse = await fetch(
          "http://localhost:4000/api/auth/google",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              idToken: response.credential
            })
          }
        );

        const data = await apiResponse.json();

        result.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        result.textContent =
          "Request failed: " + error.message +
          "\nCheck that your backend is running.";
      }
    }
  </script>
</body>
</html>
